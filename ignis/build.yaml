# Upstream publishes nobbe/ignis as a multi-arch image (linux/amd64 + linux/arm64).
# Keep this tag, BUILD_FROM in the Dockerfile and version in config.yaml in step.
build_from:
  aarch64: nobbe/ignis:0.9.0
  amd64: nobbe/ignis:0.9.0
labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Ignis (Obsidian)"
  org.opencontainers.image.source: https://github.com/Kokbo/ha-addon-ignis
  org.opencontainers.image.licenses: AGPL-3.0-only
